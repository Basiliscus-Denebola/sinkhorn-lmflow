mode: systematic
repeats: 3
budget_sec: 3600
warmup_max_iter: 20
warmup_wall_sec: 2
seeds: [42, 123, 2026]
costs: [random_dense, 1d_squared]
normalization: C/max(C); zero costs unchanged
marginals: [uniform, random_positive, spiky]
marginal_seed_offset: 100000
spiky_fraction: 0.02
spiky_mass: 0.9
fixed_thetas: [1, 1.5, 2, 4, 8]
thresholds: [1.0e-4, 1.0e-6, 1.0e-8]
solver:
  tol: 1.0e-8
  max_iter: 20000
  wall_time_limit_sec: 120
  balance_theta_max: 10.0
  numerical_mode: log_stabilized
  record_every: 1
  compute_spectrum_every: 0
blocks:
  A: {sizes: [100, 500, 1000, 2000], epsilons: [0.05, 0.01, 0.003, 0.001], marginal: uniform}
  BC: {size: 500, epsilons: [0.01, 0.001]}
  D: {size: 500, epsilon: 0.01, seed: 42, tol: 1.0e-10}
regression_config: configs/theta_balance_pilot.yaml
